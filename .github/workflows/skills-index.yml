name: Build Skills Index

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/build_skills_index.py'
      - '.github/workflows/skills-index.yml'

permissions:
  contents: read

jobs:
  build-index:
    # Only run on the upstream repository, not on forks
    if: github.repository == '519lab/thoth-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx==0.28.1 pyyaml==6.0.2

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_skills_index.py

      - name: Upload index artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7

  # Refresh the published site so the index the docs serve stays current.
  # Deploy logic lives ONLY in deploy-site.yml (it rebuilds the skills index
  # itself on a fresh checkout) — an earlier copy of those steps here drifted
  # and broke when landingpage/ was removed, deploying nothing twice a day.
  trigger-deploy:
    needs: build-index
    runs-on: ubuntu-latest
    permissions:
      actions: write
    # Only deploy on manual trigger (not on every push to the script)
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger deploy-site workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --ref main --repo "$GITHUB_REPOSITORY"
