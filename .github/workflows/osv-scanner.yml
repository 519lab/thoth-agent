name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR that touches a lockfile and on push to main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions so we can
# decide when and how to patch on our own schedule. Our pinning strategy
# (full SHA / exact version) is preserved; only the notification signal
# is added.
#
# Complements the existing supply-chain-audit.yml workflow (which scans
# for malicious code patterns in PR diffs) by covering the orthogonal
# "currently-pinned dep became known-vulnerable" case.
#
# ---------------------------------------------------------------------------
# Why the steps are inlined instead of `uses:`-ing Google's reusable workflow
# ---------------------------------------------------------------------------
# This job used to be a one-liner:
#
#   uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@<sha>
#
# Every single run of that version failed at startup, from the day it landed:
#
#   The reusable workflow
#   google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@<sha>
#   is not allowed in 519lab/thoth-agent because all reusable workflows must
#   be from a repository owned by 519lab.
#
# The org restricts *reusable workflows* to org-owned repositories. Ordinary
# third-party *actions* are not restricted (astral-sh/setup-uv, pypa/…, and
# sigstore/… all run fine), so the fix is to call the same upstream actions
# the reusable workflow calls, in the same order, directly from here.
#
# Keep this file in step with upstream's osv-scanner-reusable.yml when the
# pinned SHA moves — the step sequence below is a faithful inline copy of it
# (scan -> report -> upload artifact -> upload SARIF), minus the matrix,
# download-artifact and export-results options we do not use.
#
# Findings land in the repo's Security tab (Code Scanning > OSV-Scanner).
# fail-on-vuln is disabled so the job does not block merges on pre-existing
# vulnerabilities in pinned deps that we may need to patch deliberately.

on:
  pull_request:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'website/package.json'
      - 'website/package-lock.json'
      - 'scripts/whatsapp-bridge/package.json'
      - 'scripts/whatsapp-bridge/package-lock.json'
      - '.github/workflows/osv-scanner.yml'
  push:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package-lock.json'
      - 'website/package-lock.json'
      - 'scripts/whatsapp-bridge/package-lock.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    # GitHub-hosted on purpose: this job uploads SARIF to code scanning and
    # has no repo-specific toolchain needs, so it does not need the 519lab
    # self-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@ffa0a5f39214d80778c9b494822d94d0d9668458  # v2.5.0
        env:
          GOTOOLCHAIN: auto
        with:
          # Scan explicit lockfiles rather than recursing, so we skip
          # vendored / test / worktree dirs. All four in-repo lockfiles are
          # listed: web/ ships inside the PyPI wheel, website/ is the docs
          # site build, and scripts/whatsapp-bridge/ is a runtime bridge.
          # Add any new lockfile here AND to the trigger paths above.
          scan-args: |-
            --output=results.json
            --format=json
            --lockfile=uv.lock
            --lockfile=package-lock.json
            --lockfile=web/package-lock.json
            --lockfile=website/package-lock.json
            --lockfile=scripts/whatsapp-bridge/package-lock.json
        # Upstream does the same: a non-zero exit here means "vulns found",
        # which must not stop us from producing and uploading the report.
        continue-on-error: true

      - name: Generate SARIF report
        uses: google/osv-scanner-action/osv-reporter-action@06b2ab4348248b456ee06c9e953637f55e03504f  # v2.5.0
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Upload SARIF artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89  # v4.31.10
        with:
          sarif_file: results.sarif

      - name: Print Code Scanning URL
        if: ${{ !cancelled() }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "View the OSV-Scanner results in the 'Security' tab, using the following link:"
          echo "${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+branch%3A${GITHUB_REF_NAME}+tool%3Aosv-scanner"

      - name: Error troubleshooter
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by an error during scanning earlier in the workflow."
          exit 1
