name: Coverage

# Informational coverage baseline. This workflow is intentionally
# NON-BLOCKING: it never fails the build on a coverage number. The goal is to
# track a measured coverage baseline on main over time (job summary +
# coverage.xml artifact).
#
# Runs ONLY on push to main (post-merge), NOT on pull requests. Rationale:
# this job re-runs the ENTIRE test suite a second time (under coverage
# instrumentation) — the `tests` workflow already runs the full suite on
# every PR for correctness, so running it again per-PR just for an
# informational, non-gating number doubled the suite and made coverage the
# wall-clock long pole (~31m vs ~21m). Per-PR coverage gave no protection
# (continue-on-error, no fail_under), so moving it post-merge loses nothing.
#
# If a coverage floor is later agreed: set ``fail_under`` in
# [tool.coverage.report] (pyproject) and/or add a ratchet, re-add the
# pull_request trigger, and make it a required check.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Never block the merge queue on the coverage job while it's a baseline.
    continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: thoth
          POSTGRES_PASSWORD: thoth
          POSTGRES_DB: thoth
        ports:
          - 5432:5432
        # tmpfs over the data dir — prevents the per-run orphaned anonymous
        # docker volume from the image's VOLUME declaration (issue #330);
        # see tests.yml for the full rationale.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U thoth -d thoth"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Migrate PG schema
        run: |
          source .venv/bin/activate
          uv run alembic -c migrations/alembic.ini upgrade head
        env:
          THOTH_PG_DSN: postgresql://thoth:thoth@localhost:5432/thoth

      - name: Run tests with coverage
        # --coverage wraps each per-file pytest subprocess in
        # ``coverage run --parallel-mode`` then combines + reports + writes
        # coverage.xml. The script's exit code reflects test pass/fail; the
        # job-level continue-on-error keeps a red suite from masking the
        # coverage artifact, and coverage numbers never gate on their own.
        run: |
          source .venv/bin/activate
          python scripts/run_tests_parallel.py --coverage | tee coverage-run.log
        env:
          THOTH_PG_DSN: postgresql://thoth:thoth@localhost:5432/thoth
          POSTGRES_USER: thoth
          POSTGRES_PASSWORD: thoth
          THOTH_TEST_POSTGRES_PORT: "5432"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo "## Coverage report"
            echo ""
            echo '```'
            # The textual ``coverage report`` table is the tail of the run
            # log, fenced after the "=== Coverage ===" marker.
            sed -n '/=== Coverage ===/,$p' coverage-run.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
