name: Claude Review

# Review triggered by the `claude-review` label, applied automatically by
# claude-autolabel.yml on PR open/sync. The review step runs the
# `/code-review --comment` skill, which posts findings as inline PR comments
# directly (no sticky-comment workaround needed).
#
# Required repository secret: CLAUDE_CODE_OAUTH_TOKEN.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  # actions: read lets the action load its github_ci MCP server so reviews can
  # reference CI status. Was `write` previously — read is sufficient.
  actions: read

concurrency:
  # One review per PR at a time. Re-labeling (or autolabel firing on a new
  # push) cancels the in-flight review so we always comment on the latest diff.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.label.name == 'claude-review' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pin Opus — the action defaults to Sonnet otherwise.
          claude_args: --model claude-opus-4-8
          # The `/code-review --comment` skill posts findings as inline PR
          # comments itself, so we no longer need the track_progress /
          # use_sticky_comment workaround (anthropics/claude-code-action#1108)
          # that previously left reviews silent.
          prompt: /code-review --comment
          # TEMP debug aid while validating the OAuth/comment path — drop
          # once reviews are confirmed posting.
          show_full_output: true
