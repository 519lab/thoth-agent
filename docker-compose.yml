#
# docker-compose.yml for Thoth Agent
#
# Usage:
#   THOTH_UID=$(id -u) THOTH_GID=$(id -g) docker compose up -d
#
# Set THOTH_UID / THOTH_GID to the host user that owns ~/.thoth so
# files created inside the container stay readable/writable on the host.
# The entrypoint remaps the internal `thoth` user to these values via
# usermod/groupmod + gosu.
#
# Security notes:
#   - The dashboard service binds 0.0.0.0 INSIDE the container (so the
#     published port works on bridge networks / Docker Desktop) but is
#     published only to the host loopback (127.0.0.1:9119). It stays
#     unreachable from the LAN. It stores API keys; exposing it on LAN
#     without auth is unsafe. To reach it from another host, change the
#     published address deliberately AND put it behind a reverse proxy that
#     adds authentication, or use an SSH tunnel (`ssh -L 9119:localhost:9119`).
#   - If you override entrypoint, keep /opt/thoth/docker/entrypoint.sh in
#     the command chain. It drops root to the thoth user before gateway
#     files such as gateway.lock are created.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  gateway:
    build: .
    image: thoth-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ~/.thoth:/opt/data
    environment:
      - THOTH_UID=${THOTH_UID:-10000}
      - THOTH_GID=${THOTH_GID:-10000}
      # Reach Postgres by its compose service name on the default network.
      # On Docker Desktop (Mac/Win) `network_mode: host` is silently ignored,
      # so a localhost DSN can't see the DB — always use the service name.
      - THOTH_PG_DSN=postgresql://${POSTGRES_USER:-thoth}:${POSTGRES_PASSWORD:-thoth}@postgres:5432/${POSTGRES_DB:-thoth}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.thoth/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    # The gateway exposes no inbound port by default (messaging is outbound).
    # Publish a port here only when you enable an inbound service above —
    # e.g. the OpenAI-compatible API server (8642) or the Teams webhook
    # (3978). Bind to host loopback unless you intend LAN/Internet exposure.
    # ports:
    #   - "127.0.0.1:8642:8642"   # API_SERVER (uncomment with API_SERVER_*)
    #   - "127.0.0.1:3978:3978"   # Teams webhook (uncomment with TEAMS_PORT)
    command: ["gateway", "run"]
    # The gateway publishes no HTTP port by default, so health is probed via
    # its pid file (written to /opt/data/gateway.pid on startup) rather than
    # an endpoint. start_period covers first-boot dependency installs.
    healthcheck:
      test: ["CMD", "python3", "/opt/thoth/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  dashboard:
    image: thoth-agent
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
      # The dashboard reads the DB directly too, so gate on it explicitly.
      postgres:
        condition: service_healthy
    volumes:
      - ~/.thoth:/opt/data
    environment:
      - THOTH_UID=${THOTH_UID:-10000}
      - THOTH_GID=${THOTH_GID:-10000}
      # Same as the gateway: talk to Postgres by service name, not localhost.
      - THOTH_PG_DSN=postgresql://${POSTGRES_USER:-thoth}:${POSTGRES_PASSWORD:-thoth}@postgres:5432/${POSTGRES_DB:-thoth}
    # Published only to the host loopback — unreachable from the LAN. For
    # remote access, tunnel via `ssh -L 9119:localhost:9119`.
    ports:
      - "127.0.0.1:9119:9119"
    # Binds 0.0.0.0 INSIDE the container so the published port works on
    # bridge networks (Docker Desktop ignores host networking). --insecure
    # is required for the non-loopback in-container bind; the host-side
    # 127.0.0.1 publish above is what keeps it off the LAN.
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--insecure"]

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-thoth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thoth}
      POSTGRES_DB:       ${POSTGRES_DB:-thoth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - thoth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Dedicated PostgreSQL instance for the test suite. Runs on a different
  # port (5433 by default) and a different docker volume so pytest can
  # never collide with the real `thoth` DB. The pytest-postgresql
  # fixtures in tests/conftest.py honour POSTGRES_PORT — set it to 5433
  # (or whatever THOTH_TEST_POSTGRES_PORT resolves to) before running
  # tests, e.g.::
  #
  #     docker compose --profile test up -d postgres-test
  #     POSTGRES_PORT=5433 PYTEST_XDIST_WORKER=run_local \
  #         uv run python -m pytest tests/substrate/
  #
  # Profile-gated so a plain `docker compose up -d` doesn't start it
  # (most users don't run the test suite from compose).
  postgres-test:
    profiles: ["test"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-thoth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thoth}
      POSTGRES_DB:       ${POSTGRES_DB:-thoth}
    ports:
      - "${THOTH_TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - thoth_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Test runner — lean Debian + Python 3.11 + uv + dev deps. Mirrors
  # the GH Actions CI environment so failures reproduce locally and
  # Windows-host noise (POSIX file perms, /mnt/c paths, tilde expansion)
  # disappears. Gated behind the `test` profile alongside postgres-test
  # so plain `docker compose up -d` doesn't build it.
  #
  # Usage:
  #     docker compose --profile test up -d postgres-test
  #     docker compose --profile test build test-runner
  #     docker compose --profile test run --rm test-runner   # full suite
  #     docker compose --profile test run --rm test-runner \
  #         python -m pytest tests/substrate/ -o "addopts=" \
  #         --timeout-method=thread --timeout=300
  #
  # Source is bind-mounted at /work so test edits don't require a
  # rebuild. The .venv layer survives because it lives in the image
  # at /work/.venv — bind mounts on Linux overlay only the host paths
  # that exist; ours does not contain a .venv (gitignored).
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    image: thoth-test-runner
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      # Inside the compose network, the test PG is reachable by service
      # name on its container-side port 5432 (not the host-mapped 5433).
      THOTH_PG_DSN: postgresql://thoth:thoth@postgres-test:5432/thoth
      THOTH_TEST_POSTGRES_HOST: postgres-test
      THOTH_TEST_POSTGRES_PORT: "5432"
      POSTGRES_USER: thoth
      POSTGRES_PASSWORD: thoth
      # CI parity — set so the perf microbenches honour the CI ceilings.
      CI: "true"
      # Deterministic runtime.
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
    volumes:
      # Bind-mount source so iterating on tests doesn't need a rebuild.
      # The venv lives at /opt/venv (outside /work) so this bind-mount
      # doesn't hide it.
      - .:/work
      # Persist uv cache between runs to speed up dep installs. Lives
      # outside /work for the same reason as the venv.
      - thoth_test_uv_cache:/opt/uv-cache

volumes:
  thoth_pg_data:
  thoth_pg_test_data:
  thoth_test_uv_cache:
